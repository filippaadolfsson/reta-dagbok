<title>Reta-dagboken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: mobilapp, en kolumn max 560px, flikar i botten. Ton: kliniskt lugn journal med mineralgrönt. */
:root{
  --bg:#EAEFEE; --surface:#FFFFFF; --sunk:#DDE5E3; --ink:#13221F; --muted:#56665F; --line:#C9D4D1;
  --accent:#0F6E5C; --accent-soft:#D3E9E3; --curve:#0F6E5C; --curve-fill:rgba(15,110,92,.14); --bar:#A9CFC4;
  --ok:#2E7D4F; --ok-soft:#DCEFE3; --warn:#9A6200; --warn-soft:#F6E7C8; --alert:#B2382E; --alert-soft:#F7DEDA;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1817; --surface:#172422; --sunk:#0B1312; --ink:#E4EEEB; --muted:#93A6A0; --line:#2A3B38;
  --accent:#4FC1A6; --accent-soft:#173B34; --curve:#4FC1A6; --curve-fill:rgba(79,193,166,.16); --bar:#2F6157;
  --ok:#6CCB92; --ok-soft:#163323; --warn:#E3B055; --warn-soft:#3A2D12; --alert:#F08A7F; --alert-soft:#3D1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1817; --surface:#172422; --sunk:#0B1312; --ink:#E4EEEB; --muted:#93A6A0; --line:#2A3B38;
  --accent:#4FC1A6; --accent-soft:#173B34; --curve:#4FC1A6; --curve-fill:rgba(79,193,166,.16); --bar:#2F6157;
  --ok:#6CCB92; --ok-soft:#163323; --warn:#E3B055; --warn-soft:#3A2D12; --alert:#F08A7F; --alert-soft:#3D1E1B; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:20px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.section{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.92rem}
.banner b{color:var(--warn)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:10px;padding:11px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:7px 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Statusrad */
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.status div{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.status .v{font-family:var(--f-mono);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.status .k{font-size:.75rem;color:var(--muted)}
/* Veckobana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week span{height:30px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.week span.on{background:var(--accent);color:var(--surface);font-weight:600}
.week span.past{background:var(--accent-soft);color:var(--accent)}
/* Symptomlista */
.slist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sitem{display:flex;align-items:center;gap:12px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.sitem .t{flex:1;min-width:0}
.sitem .t b{display:block}
.sitem .t small{color:var(--muted);font-size:.85rem}
.chev{color:var(--muted);font-family:var(--f-mono)}
.ev{font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:99px;white-space:nowrap}
.ev.study{background:var(--ok-soft);color:var(--ok)}
.ev.report{background:var(--warn-soft);color:var(--warn)}
.ev.user{background:var(--sunk);color:var(--muted)}
.cathead{font-size:.95rem;padding:18px 2px 6px;border-bottom:1px solid var(--line);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 13px;font-size:.92rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
/* Flikar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:20}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:12px 4px 10px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
/* Formulär */
label{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:.88rem;color:var(--muted);font-weight:700}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0;width:100%;max-width:100%;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:minmax(0,1fr)}}
html,body{overflow-x:hidden}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.site{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 4px;font-size:.85rem;text-align:center}
.site.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.site.tip{border-style:dashed;border-color:var(--accent)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.hist div span:first-child{flex:1;min-width:0}
.x{background:none;border:0;color:var(--muted);padding:4px 8px;font-size:1.1rem}
/* Kort-ark */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h4{font-family:var(--f-display);font-size:.95rem;margin:0}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.care{background:var(--alert-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.care h4{color:var(--alert)}
.srcs{font-size:.82rem;color:var(--muted)}
.srcs a{color:var(--accent)}
.sev{display:flex;gap:6px}
.sev button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 4px;font-size:.9rem}
.sev button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.big{font-family:var(--f-display);font-size:2rem;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.1}
.big .mono{font-weight:600}
.big .muted{font-size:1rem;font-family:var(--f-body)}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.foods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.food{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px;font-size:.88rem;text-align:left}
.food span:first-child{min-width:0}
.food .mono{color:var(--accent);font-weight:600;white-space:nowrap}
.todayk{text-align:left;width:100%;font:inherit;color:inherit}
.todayk .row{gap:20px}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.aim{position:absolute;left:8%;right:8%;top:36%;height:28%;border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.food.mine{border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;z-index:50}
/* Diagram */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--curve);vertical-align:middle;margin-right:6px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--curve) 0 5px,transparent 5px 9px)}
.pattern{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:.92rem}
.bars{display:grid;grid-template-columns:repeat(8,14px);gap:3px;align-items:end;height:26px}
.bars span{background:var(--accent);border-radius:2px;min-height:2px}
.bars span.z{background:var(--sunk)}
.search{width:100%}
.foot{font-size:.8rem;color:var(--muted);line-height:1.45}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

  return {doses:d,symptoms:[
    {t:now-1*DAY+2*HOUR,id:"sleep",sev:2},{t:now-8*DAY+2*HOUR,id:"sleep",sev:2},{t:now-15*DAY,id:"sleep",sev:1},
    {t:now-1*DAY,id:"heat",sev:1},{t:now-3*DAY,id:"drymouth",sev:1},{t:now-6*DAY,id:"hunger",sev:2},{t:now-13*DAY,id:"hunger",sev:2},

}

/* ---------- Beräkningar ---------- */
function levelAt(t,doses,hl){
  const ke=Math.LN2/(hl*24), ka=Math.LN2/8; let s=0;
  for(const d of doses){const h=(t-d.t)/HOUR; if(h<0)continue; s+=d.mg*ka/(ka-ke)*(Math.exp(-ke*h)-Math.exp(-ka*h));}
  return s;
}
function sorted(a){return [...a].sort((x,y)=>x.t-y.t)}
function info(){
  const D=data(), ds=sorted(D.doses), now=Date.now();
  if(!ds.length) return null;
  const last=ds[ds.length-1], first=ds[0];
  const day=Math.floor((now-last.t)/DAY);
  const week=Math.floor((now-first.t)/(7*DAY))+1;
  let incAt=null; for(let i=1;i<ds.length;i++) if(ds[i].mg>ds[i-1].mg) incAt=ds[i].t;
  const sinceInc=incAt?Math.floor((now-incAt)/DAY):null;
  const sameDoseSince=(()=>{let t=last.t;for(let i=ds.length-1;i>=0&&ds[i].mg===last.mg;i--)t=ds[i].t;return t})();
  const weeksAtDose=Math.floor((now-sameDoseSince)/(7*DAY))+1;
  const phase=day<=1?"rise":day<=4?"peak":"low";
  return {ds,last,day,week,phase,sinceInc,weeksAtDose,level:levelAt(now,ds,D.settings.halfLife||6)};
}
function dayAfter(t,ds){let l=null;for(const d of ds){if(d.t<=t)l=d;}return l?Math.floor((t-l.t)/DAY):null}
function patterns(){
  const D=data(), ds=sorted(D.doses), m={};
  for(const s of D.symptoms){const d=dayAfter(s.t,ds); if(d==null||d>7)continue; (m[s.id]=m[s.id]||Array(8).fill(0))[d]++;}
  return Object.entries(m).map(([id,arr])=>{const tot=arr.reduce((a,b)=>a+b,0);const top=arr.indexOf(Math.max(...arr));return{id,arr,tot,top}}).sort((a,b)=>b.tot-a.tot);
}
function suggestSite(){
  const ds=sorted(data().doses); const lastUse={}; SITES.forEach(s=>lastUse[s]=-1);
  ds.forEach((d,i)=>{if(d.site)lastUse[d.site]=i}); return SITES.reduce((a,b)=>lastUse[b]<lastUse[a]?b:a);
}

 peak:{title:"Nivån ligger högt",body:"Du är nära veckans högsta nivå och den sjunker långsamt. Magen arbetar långsammare, så förstoppning, torr mun och trötthet kan dyka upp nu, ofta för att du ätit och druckit mindre några dagar."},
 low:{title:"Nivån sjunker mot nästa dos",body:"Ungefär hälften av förra dosen är kvar efter sex dagar. Hungern och suget kan komma tillbaka, särskilt på morgonen. Det är förväntat och betyder inte att det slutat fungera."}
};
function nowList(I){
  const out=[], add=(id,why)=>{if(!out.find(o=>o.id===id))out.push({id,why})};
  const pats=patterns();
  pats.forEach(p=>{if(p.arr[Math.min(I.day,7)]>0)add(p.id,`Du har loggat det ${p.arr[Math.min(I.day,7)]} gång${p.arr[Math.min(I.day,7)]>1?"er":""} ${dLabel(Math.min(I.day,7))} tidigare`)});
  if(I.sinceInc!=null&&I.sinceInc<=28){add("nausea","Du höjde dosen för "+I.sinceInc+" dagar sedan");add("stomach","Vanligt veckorna efter dosökning")}
  LIB.filter(x=>x.phase.includes(I.phase)).forEach(x=>add(x.id,"Vanligt i den här delen av veckan"));
  if(I.weeksAtDose<=4) add("hunger","Nivån har inte byggts upp helt än (vecka "+I.weeksAtDose+" på samma dos)");
  return out.slice(0,6);
}

function vNiva(){
  const D=data(), ds=sorted(D.doses), hl=D.settings.halfLife||6;
  if(!ds.length) return `<div class="panel"><h2>Nivå i kroppen</h2><p class="muted">Kurvan ritas när du loggat din första dos.</p><button class="btn" data-tab="logga">Logga dos</button></div>`;
  const now=Date.now(), t0=Math.max(ds[0].t-DAY, now-56*DAY), t1=now+14*DAY;
  const last=ds[ds.length-1], proj=[...ds]; for(let t=last.t+7*DAY;t<=t1;t+=7*DAY) proj.push({t,mg:last.mg,p:1});
  const N=180, pts=[]; let mx=0;
  for(let i=0;i<=N;i++){const t=t0+(t1-t0)*i/N, v=levelAt(t,t<=now?ds:proj,hl); pts.push([t,v]); mx=Math.max(mx,v)}
  const W=360,H=230,L=34,R=10,T=14,B=30, top=niceMax(mx);
  const X=t=>L+(t-t0)/(t1-t0)*(W-L-R), Y=v=>T+(1-v/top)*(H-T-B);
  const past=pts.filter(p=>p[0]<=now), fut=pts.filter(p=>p[0]>=now);
  const path=a=>a.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
  const area=past.length?path(past)+`L${X(past[past.length-1][0]).toFixed(1)},${Y(0)}L${X(past[0][0]).toFixed(1)},${Y(0)}Z`:"";
  const ticks=[0,top/2,top];
  const xt=[]; for(let t=Math.ceil(t0/(7*DAY))*7*DAY;t<t1;t+=7*DAY) xt.push(t);
  const cur=levelAt(now,ds,hl);
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Uppskattad mängd i kroppen över tid">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${num(v)}</text>`).join("")}
   ${xt.map(t=>`<text x="${X(t)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${new Date(t).toLocaleDateString("sv-SE",{day:"numeric",month:"short"})}</text>`).join("")}
   <path d="${area}" fill="var(--curve-fill)"/>
   <path d="${path(past)}" fill="none" stroke="var(--curve)" stroke-width="2.4" stroke-linejoin="round"/>
   <path d="${path(fut)}" fill="none" stroke="var(--curve)" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/>
   ${ds.filter(d=>d.t>=t0).map(d=>`<line x1="${X(d.t)}" x2="${X(d.t)}" y1="${Y(0)}" y2="${Y(0)+6}" stroke="var(--ink)" stroke-width="1.5"/>`).join("")}
   <line x1="${X(now)}" x2="${X(now)}" y1="${T}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>
   <circle cx="${X(now)}" cy="${Y(cur)}" r="5" fill="var(--curve)" stroke="var(--surface)" stroke-width="2"/>
   <text x="${Math.min(X(now)+8,W-R-52)}" y="${Math.max(Y(cur)-10,T+10)}" font-size="11" font-weight="600" fill="var(--ink)" font-family="var(--f-mono)">${num(cur)} mg</text>
  </svg>`;
  const ss=last.mg/(1-Math.pow(0.5,7/hl));
  return `${demoBanner()}
  <header class="section"><span class="eyebrow">Farmakokinetik</span><h1>Nivå i kroppen</h1></header>
  <section class="panel"><div class="chart">${svg}</div>
   <div class="legend"><span><i></i>Uppskattad mängd</span><span><i class="dash"></i>Om du fortsätter med ${num(last.mg,last.mg%1?1:0)} mg/vecka</span><span>▏ = loggad dos</span></div></section>
  <section class="panel"><span class="eyebrow">Så läser du kurvan</span>
   <p>Varje dos lägger sig ovanpå det som finns kvar från tidigare veckor. Därför stiger kurvan trappvis de första veckorna och planar sedan ut. Vid ${num(last.mg,last.mg%1?1:0)} mg i veckan landar toppen till slut runt <span class="mono">${num(ss)}</span> mg.</p>
   <p class="muted">Förenklad modell. Halveringstiden kommer från Lillys fas 1-data (cirka 6 dagar). Hur snabbt dosen tas upp från huden är ett antagande, och verkliga nivåer varierar mellan personer. Använd kurvan för att förstå mönster, inte för att bestämma doser.</p>
   <label for="hl">Halveringstid i modellen (dagar)<input id="hl" type="number" min="3" max="10" step="0.5" value="${hl}"></label></section>
  ${foot()}`;
}

  </section>
  <section class="panel"><span class="eyebrow">Vikt</span>
   ${Wt.length?`<div class="big"><span class="mono">${num(Wt[Wt.length-1].kg)}</span><span class="muted">kg</span></div>${Wt.length>1?`<p class="muted" style="font-size:.9rem">${num(Wt[Wt.length-1].kg-Wt[0].kg)} kg sedan ${fmtD(Wt[0].t)}</p><div class="chart">${weightChart(Wt)}</div>`:""}`:`<p class="muted">Ingen vikt loggad än.</p>`}
   <div class="row"><input id="kg" type="number" inputmode="decimal" step="0.1" min="30" max="300" placeholder="Vikt i kg" aria-label="Vikt i kg" style="flex:1;width:auto"><button class="btn small" id="savekg">Spara</button></div>
   ${Wt.length?`<div class="hist">${[...Wt].reverse().slice(0,5).map(w=>`<div><span>${fmtD(w.t)}</span><span class="mono">${num(w.kg)} kg</span>${demo?"":`<button class="x" aria-label="Ta bort" data-delkg="${w.t}">×</button>`}</div>`).join("")}</div>`:""}
  </section>
  <section class="panel"><span class="eyebrow">Mål</span>
   <div class="grid2"><label for="pf">Protein per kg<select id="pf">${[1.0,1.2,1.4,1.6].map(v=>`<option value="${v}" ${(s.proteinFactor||1.2)==v?"selected":""}>${num(v)} g per kg</option>`).join("")}</select></label>
   <label for="gw">Räkna på vikt (valfritt)<input id="gw" type="number" inputmode="decimal" placeholder="${kg?"Nu: "+num(kg)+" kg":"t.ex. målvikt"}" value="${s.goalWeight||""}"></label>
   <label for="pm">Eget proteinmål i gram<input id="pm" type="number" inputmode="numeric" placeholder="Tomt = automatiskt" value="${s.proteinManual||""}"></label>
   <label for="sg">Stegmål<input id="sg" type="number" inputmode="numeric" value="${sgoal}"></label></div>
   <button class="btn ghost small" id="savegoals">Spara mål</button>
   ${(s.myFoods||[]).length?`<span class="eyebrow">Egna snabbknappar</span><div class="hist">${s.myFoods.map((f,i)=>`<div><span>${esc(f.name)}</span><span class="mono">${f.g} g</span>${demo?"":`<button class="x" aria-label="Ta bort" data-delfav="${i}">×</button>`}</div>`).join("")}</div>`:""}
   <p class="muted" style="font-size:.85rem">Vanliga råd vid viktnedgång ligger runt 1,2–1,6 g protein per kg kroppsvikt. Vid hög vikt räknar många på målvikten istället. Ditt mål just nu: <b>${goal?goal+" g per dag":"inte satt"}</b>.</p>
  </section>
  ${foot()}`;
}
function foot(){return `<p class="foot">Personlig dagbok med information från publicerade studier och rapporter. Inte medicinsk rådgivning. Retatrutid är ett läkemedel under utveckling och är ännu inte godkänt. Ändra aldrig dos utan att prata med den som förskriver.</p>`}

function render(){
  renderTabs();
  $("#app").innerHTML=({idag:vIdag,niva:vNiva,kost:vKost,logga:vLogga,bibliotek:vBibliotek})[tab]();
}

/* ---------- Kort ---------- */
let sev=1;
function openCard(id){
  const x=byId(id); if(!x) return; sev=1;
  const pats=patterns().find(p=>p.id===id);
  $("#layer").innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ct">
   <div class="row" style="justify-content:space-between"><span class="ev ${x.ev}">${EV[x.ev]}</span><button class="x" id="close" aria-label="Stäng">×</button></div>
   <h2 id="ct">${x.name}</h2>
   ${pats?`<p class="banner" style="background:var(--accent-soft)"><b style="color:var(--accent)">Ditt mönster:</b> loggat ${pats.tot} gång${pats.tot>1?"er":""}, oftast ${dLabel(pats.top)}.</p>`:""}
   <div><h4>Vad forskningen säger</h4><p>${x.research}</p></div>
   <div><h4>Varför det kan hända</h4><p>${x.why}</p></div>
   ${x.when?`<div><h4>När det brukar märkas</h4><p>${x.when}</p></div>`:""}
   <div><h4>Att testa</h4><ul>${x.tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>
   <div class="care"><h4>${x.cat==="pos"?"Prata med läkaren om":"Hör av dig till vården om"}</h4><ul>${x.care.map(t=>`<li>${t}</li>`).join("")}</ul><p style="font-size:.88rem">1177 för råd, 112 vid akut fara.</p></div>
   ${x.src.length?`<p class="srcs">Källor: ${x.src.map(i=>`<a href="${SRC[i][1]}" target="_blank" rel="noopener">${SRC[i][0]}</a>`).join(" · ")}</p>`:""}
   ${demo?`<p class="muted" style="font-size:.88rem">Logga en dos först för att kunna spara symptom.</p>`:`<div class="panel" style="background:var(--bg)"><h4>Logga idag</h4>
    <div class="sev" id="sev">${(x.cat==="pos"?["Lite","Tydligt","Mycket"]:["Lätt","Måttlig","Kraftig"]).map((s,i)=>`<button data-sev="${i+1}" class="${i===0?"on":""}">${s}</button>`).join("")}</div>
    <label for="note">Anteckning (valfritt)<input id="note" type="text" maxlength="140" placeholder="t.ex. vaknade 03:30"></label>
    <button class="btn" data-logsym="${x.id}">Logga ${x.name.toLowerCase()}</button></div>`}
  </div></div>`;
  $("#close").focus();
}
function closeCard(){stopScan();$("#layer").innerHTML=""}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* ---------- Lagring ---------- */
function persist(){
  try{ localStorage.setItem("reta-dagbok",JSON.stringify(state)); }
  catch(e){ toast("Kunde inte spara i webbläsaren. Är privat läge påslaget?"); }
}
function boot(){
  try{const raw=localStorage.getItem("reta-dagbok"); if(raw) state=Object.assign(state,JSON.parse(raw));}catch(e){}
  state.food=state.food||{}; state.weights=state.weights||[];
  demo=isEmpty(); render();
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="reta-dagbok-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  try{localStorage.setItem("reta-dagbok-backup",String(Date.now()))}catch(e){}
  toast("Backup sparad"); render();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!Array.isArray(d.doses)||!Array.isArray(d.symptoms)) throw 0;
    state={doses:d.doses,symptoms:d.symptoms,settings:Object.assign({halfLife:6},d.settings||{}),food:d.food||{},weights:d.weights||[]}; demo=isEmpty(); persist(); toast("Backup inläst"); render();
  }catch(e){toast("Filen kunde inte läsas. Välj en backupfil från Reta-dagboken.")}};
  r.readAsText(file);
}
function lastBackup(){try{const v=localStorage.getItem("reta-dagbok-backup");return v?+v:null}catch(e){return null}}

/* ---------- Händelser ---------- */
let pickedSite=null;
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-tab],#bg"); if(!t) return;
  if(t.id==="bg"&&e.target.id==="bg"){closeCard();return}
  if(t.dataset.tab){tab=t.dataset.tab;closeCard();render();window.scrollTo(0,0);return}
  if(t.dataset.card){openCard(t.dataset.card);return}
  if(t.id==="close"){closeCard();return}
  if(t.dataset.sev){sev=+t.dataset.sev;document.querySelectorAll("#sev button").forEach(b=>b.classList.toggle("on",b===t));return}
  if(t.dataset.site){pickedSite=t.dataset.site;document.querySelectorAll(".site").forEach(b=>b.classList.toggle("on",b===t));return}
  if(t.id==="exp"){exportData();return}
  if(t.id==="ical"){addToCalendar();return}
  if(t.dataset.food){const f=FOODS[+t.dataset.food];addProtein(f[1],f[0]);toast("+"+f[1]+" g protein");return}
  if(t.id==="addp"){const g=parseFloat(($("#pg").value||"").replace(",","."));if(!(g>0&&g<=300)){toast("Skriv antal gram protein.");return}addProtein(Math.round(g),"Eget");toast("+"+Math.round(g)+" g protein");return}
  if(t.dataset.delp!=null){const day=state.food[dk()];if(day&&day.protein){day.protein.splice(+t.dataset.delp,1);persist();render()}return}
  if(t.id==="savesteps"){const n=parseInt(($("#steps").value||"").replace(/\D/g,""),10);if(!(n>=0)){toast("Skriv antal steg.");return}ensureReal();const k=dk();(state.food[k]=state.food[k]||{}).steps=n;persist();toast("Steg sparade");render();return}
  if(t.id==="savekg"){const v=parseFloat(($("#kg").value||"").replace(",","."));if(!(v>=30&&v<=300)){toast("Skriv vikten i kg.");return}ensureReal();state.weights.push({t:Date.now(),kg:Math.round(v*10)/10});persist();toast("Vikt sparad");render();return}
  if(t.dataset.delkg){state.weights=state.weights.filter(w=>String(w.t)!==t.dataset.delkg);demo=isEmpty();persist();render();return}
  if(t.id==="savegoals"){ensureReal();const pf=parseFloat($("#pf").value),gw=parseFloat(($("#gw").value||"").replace(",",".")),pm=parseInt($("#pm").value,10),sg=parseInt($("#sg").value,10);Object.assign(state.settings,{proteinFactor:pf,goalWeight:gw>0?gw:0,proteinManual:pm>0?pm:0,stepGoal:sg>0?sg:8000});persist();toast("Mål sparade");render();return}
  if(t.id==="scan"){openScanner();return}
  if(t.id==="bcgo"){const c=($("#bc").value||"").replace(/\D/g,"");if(c.length<8){toast("Skriv hela numret under streckkoden.");return}onCode(c);return}
  if(t.id==="msave"){const p100=parseFloat(($("#mp100").value||"").replace(",","."));if(!(p100>=0&&p100<=100)){toast("Fyll i protein per 100 g.");return}const P={name:($("#mname").value||"").trim()||"Egen produkt",brand:"",p100,size:parseFloat($("#msize").value)||0,serving:0};ensureReal();(state.settings.barcodes=state.settings.barcodes||{})[t.dataset.code]=P;persist();showProduct(Object.assign({code:t.dataset.code},P));return}
  if(t.dataset.portion){$("#grams").value=t.dataset.portion;document.querySelectorAll("[data-portion]").forEach(b=>b.classList.toggle("on",b===t));calcScan();return}
  if(t.id==="addscan"){const g=parseFloat($("#grams").value)||0;if(!(g>0)){toast("Skriv hur många gram du åt.");return}const pr=Math.round(curProd.p100*g/100);ensureReal();
    if(curProd.src==="off")(state.settings.barcodes=state.settings.barcodes||{})[curProd.code]={name:curProd.name,brand:curProd.brand,p100:curProd.p100,size:curProd.size,serving:curProd.serving,src:"off"};
    if($("#savefav").checked)(state.settings.myFoods=state.settings.myFoods||[]).push({name:curProd.name+" "+Math.round(g)+" g",g:pr});
    const nm=curProd.name;closeCard();addProtein(pr,nm);toast("+"+pr+" g protein");return}
  if(t.dataset.myfood!=null){const f=(state.settings.myFoods||[])[+t.dataset.myfood];if(f){addProtein(f.g,f.name);toast("+"+f.g+" g protein")}return}
  if(t.dataset.delfav!=null){state.settings.myFoods.splice(+t.dataset.delfav,1);persist();render();return}
  if(t.id==="saveDose"){
    const dt=$("#dt").value, mg=parseFloat(($("#mg").value||"").replace(",","."));
    if(!dt||!(mg>0)){toast("Fyll i datum och dos i mg.");return}
    ensureReal();
    state.doses.push({t:new Date(dt).getTime(),mg,site:pickedSite||suggestSite()}); pickedSite=null;
    persist(); toast("Dos sparad"); tab="idag"; render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.logsym){
    state.symptoms.push({t:Date.now(),id:t.dataset.logsym,sev,note:($("#note")?.value||"").trim()||undefined});
    persist(); closeCard(); toast("Loggat"); render(); return;
  }
  if(t.dataset.deldose){state.doses=state.doses.filter(d=>String(d.t)!==t.dataset.deldose);demo=isEmpty();persist();render();return}
  if(t.dataset.delsym){const[ts,id]=t.dataset.delsym.split("|");state.symptoms=state.symptoms.filter(s=>!(String(s.t)===ts&&s.id===id));persist();render();return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="grams"){document.querySelectorAll("[data-portion]").forEach(b=>b.classList.remove("on"));calcScan();return}
  if(e.target.id==="q"){q=e.target.value;$("#libList").innerHTML=libItems(LIB.filter(x=>!q||(x.name+" "+x.short).toLowerCase().includes(q.toLowerCase())))}
});
document.addEventListener("change",e=>{
  if(e.target.id==="snap"&&e.target.files[0]){decodeFile(e.target.files[0]);e.target.value="";return}
  if(e.target.id==="imp"&&e.target.files[0]){importData(e.target.files[0]);e.target.value="";return}
  if(e.target.id==="hl"){const v=parseFloat(e.target.value);if(v>=3&&v<=10){state.settings.halfLife=v;if(!demo)persist();render()}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard()});
boot();
</script>
</body>
</html>
